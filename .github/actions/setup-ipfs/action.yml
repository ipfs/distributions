name: Setup IPFS
description: Setup IPFS
runs:
  using: "composite"
  steps:
    - uses: ipfs/download-ipfs-distribution-action@v2
      with:
        name: kubo
        version: "${{ env.KUBO_VER }}"
    # TEMPORARY: the ipfs-cluster-ctl download and the "Preconnect to cluster
    # peers" step are removed because the collab cluster is shut down.
    # See https://github.com/ipfs/distributions/issues/1220
    - name: Init IPFS daemon
      run: |
        # fix resolv - DNS provided by Github is unreliable for DNSLik/dnsaddr
        sudo sed -i -e 's/nameserver 127.0.0.*/nameserver 1.1.1.1/g' /etc/resolv.conf
        ipfs init --profile server,randomports,unixfs-v1-2025
        ipfs config Routing.Type autoclient
        # advertise pinned content and MFS so ipfs-cluster peers can fetch
        # the full DAG without waiting on bitswap-only discovery
        ipfs config Provide.Strategy pinned+mfs+unique+entities
        # CI node is ephemeral, no point in getting a cert for it
        ipfs config --json AutoTLS.Enabled false
      shell: bash
    - uses: ipfs/start-ipfs-daemon-action@v1
      with:
        args: --enable-gc=false
    - name: List swarm peers
      run: ipfs swarm peers
      shell: bash
